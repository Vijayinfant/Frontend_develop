services:
  # Database Services
  - type: redis
    name: fedi-redis
    ipAllowList: [] # internal use only
    plan: free

  - type: psql
    name: fedi-postgres
    databaseName: prompt_db
    user: prompt_user
    plan: free

  # Backend API
  - type: web
    name: fedi-backend
    env: python
    rootDir: backend
    buildCommand: "cd backend && pip install -r requirements.txt && python manage.py migrate"
    startCommand: "cd backend && gunicorn prompt_library.wsgi:application"
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: fedi-postgres
          property: host
      - key: DB_USER
        fromDatabase:
          name: fedi-postgres
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: fedi-postgres
          property: password
      - key: DB_NAME
        fromDatabase:
          name: fedi-postgres
          property: database
      - key: REDIS_HOST
        fromService:
          name: fedi-redis
          type: redis
          property: host
      - key: PYTHON_VERSION
        value: "3.10.12"
      
  # Frontend App
  - type: web
    name: fedi-frontend
    env: node
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    startCommand: "npm run start" # Note: For production, using static site hosting is better, but this will work.
